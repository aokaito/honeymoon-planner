<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>画面イメージ：行き先候補</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* ---- 候補画面だけのスタイル（モック用） ---- */
.tabbar{grid-template-columns:repeat(4,1fr)}
.citytabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:4px 16px 12px}
.citytab{min-height:48px;border:1.5px solid var(--city);background:var(--card);border-radius:14px;font-size:15px;font-weight:500;color:var(--ink)}
.citytab[aria-current="true"]{background:var(--city)}
.citytab[aria-current="true"][data-light="0"]{color:#fff}
.view{padding-bottom:calc(var(--tabbar-h) + var(--safe-b) + 24px)}
.note-pad{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;border-top:5px solid var(--city)}
.cattabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--line)}
.cattabs button{min-height:48px;border:none;background:none;font-size:15px;color:var(--sub);position:relative}
.cattabs button .n{font-size:12px;margin-left:4px;opacity:.8}
.cattabs button[aria-selected="true"]{color:var(--ink);font-weight:700}
.cattabs button[aria-selected="true"]::after{content:"";position:absolute;left:22%;right:22%;bottom:-1px;height:3px;border-radius:3px;background:var(--city)}
.memo{display:block;width:100%;min-height:calc(100dvh - 330px);border:none;outline:none;resize:none;background:transparent;
  font-size:16px;line-height:36px;padding:2px 16px 36px 16px;color:var(--ink);
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--line) 35px,var(--line) 36px);
  background-attachment:local;background-position:0 2px}
.memo::placeholder{color:#c2b3a9}
.pad-foot{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--sub)}
.saved{display:inline-flex;align-items:center;gap:5px}
.saved::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--green)}
.mock-note{margin:16px 4px 0;font-size:12px;color:var(--sub);text-align:center}
</style>
</head>
<body>
<div id="main">
  <header class="appbar">
    <div class="appbar-row">
      <div class="brand">
        <div class="brand-title">行き先候補</div>
        <div class="brand-sub">行きたい場所・お店のメモ</div>
      </div>
    </div>
    <nav class="citytabs" id="citytabs"></nav>
  </header>

  <main class="view">
    <section class="note-pad" id="pad">
      <div class="cattabs" id="cattabs" role="tablist"></div>
      <textarea class="memo" id="memo" enterkeyhint="enter" spellcheck="false"></textarea>
      <div class="pad-foot"><span id="count"></span><span class="saved" id="saved">保存済み</span></div>
    </section>
    <p class="mock-note">※ 画面イメージ（ダミーデータ）です。1行＝1件。打つと自動で保存し、2人の画面に反映される想定</p>
  </main>

  <nav class="tabbar" aria-label="メニュー">
    <button>
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3.5 10h17M8 3v4M16 3v4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>日程</span>
    </button>
    <button aria-current="page">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>
      <span>候補</span>
    </button>
    <button>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7.5A2.5 2.5 0 0 1 6.5 5h11A2.5 2.5 0 0 1 20 7.5v1.8a2.2 2.2 0 0 0 0 4.4v1.8a2.5 2.5 0 0 1-2.5 2.5h-11A2.5 2.5 0 0 1 4 15.5v-1.8a2.2 2.2 0 0 0 0-4.4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14.5 5.5v12" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2 2.2"/></svg>
      <span>ツアー情報</span>
    </button>
    <button>
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      <span>設定</span>
    </button>
  </nav>
</div>

<script>
const CITIES = [
  {k:'lon', name:'ロンドン', light:1},
  {k:'par', name:'パリ', light:1},
  {k:'rom', name:'ローマ', light:0},
];
const CATS = [
  {k:'food', name:'食事', ph:'例：\nDishoom（朝食のベーコンナン）\nアフタヌーンティー'},
  {k:'sight', name:'観光', ph:'例：\nナショナル・ギャラリー\nスカイ・ガーデン（要予約）'},
  {k:'other', name:'その他', ph:'例：\n紅茶のおみやげ\nオイスターカード'},
];
// ダミーデータ（都市×種類ごとに1つのメモ）
const MEMO = {
  lon:{ food:'Dishoom（朝食のベーコンナンロール・早めに並ぶ）\nアフタヌーンティー どこかで1回\nバラ・マーケットで食べ歩き\nパブでサンデーロースト',
        sight:'ナショナル・ギャラリー（無料）\nスカイ・ガーデン 要予約\nノッティング・ヒル', other:'Fortnum & Mason で紅茶のおみやげ\nコンタクトレス決済のカード' },
  par:{ food:'Du Pain et des Idées（日曜休み）\nビストロでディナー1回\nマカロン食べ比べ', sight:'オランジュリー美術館（睡蓮）\nモンマルトル散歩', other:'ボン・マルシェでおみやげ' },
  rom:{ food:'カルボナーラの名店 2〜3軒しぼる', sight:'トレビの泉でコイン（夜も）', other:'' },
};
let city = 'lon', cat = 'food';
const $ = s => document.querySelector(s);
const lines = t => t.split('\n').filter(l => l.trim()).length;

function render(){
  $('#citytabs').innerHTML = CITIES.map(c =>
    `<button class="citytab" style="--city:var(--${c.k})" data-light="${c.light}" data-city="${c.k}" aria-current="${c.k===city}">${c.name}</button>`).join('');
  $('#cattabs').innerHTML = CATS.map(c =>
    `<button role="tab" data-cat="${c.k}" aria-selected="${c.k===cat}">${c.name}<span class="n">${lines(MEMO[city][c.k])}</span></button>`).join('');
  $('#pad').style.setProperty('--city', `var(--${city})`);
  const m = $('#memo');
  m.value = MEMO[city][cat];
  m.placeholder = CATS.find(c => c.k === cat).ph;
  updateCount();
}
function updateCount(){ $('#count').textContent = `${lines($('#memo').value)}件`; }
let t;
$('#memo').addEventListener('input', e => {
  MEMO[city][cat] = e.target.value; updateCount();
  $('#cattabs [aria-selected="true"] .n').textContent = lines(e.target.value);
  $('#saved').textContent = '保存中…'; clearTimeout(t); t = setTimeout(() => $('#saved').textContent = '保存済み', 700);
});
document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.city){ city = b.dataset.city; render(); }
  else if (b.dataset.cat){ cat = b.dataset.cat; render(); }
});
render();
</script>
</body>
</html>
